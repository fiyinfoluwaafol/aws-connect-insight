# Local Postgres for DB integration tests.
# Usage: docker compose -f docker-compose.test.yml up -d
# Run migrations from backend/migrations/ when available.
# Tests use transaction rollback for deterministic cleanup.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: aws_connect_insight_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d aws_connect_insight_test"]
      interval: 2s
      timeout: 5s
      retries: 5
